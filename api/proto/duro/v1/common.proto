syntax = "proto3";

package duro.v1;

option go_package = "github.com/duro-d/duro/api/gen/go/duro/v1;durov1";

// Поле сообщения отсутствует, если значение не передано. JSON null занимает четыре байта.
message JsonValue {
  bytes utf8 = 1;
}

// Хеш вычисляется от исходных байтов ESM bundle и занимает 32 байта.
message CodeRef {
  string type = 1;
  string version = 2;
  bytes sha256 = 3;
}

message CodeManifest {
  CodeRef code = 1;
  string runtime = 2;
  string format = 3;
  repeated string methods = 4;
}

message CodePackage {
  CodeManifest manifest = 1;
  bytes bundle = 2;
}

// При каждом запуске процесс получает новый worker_id. Первое поколение равно 1.
message Owner {
  string object_id = 1;
  string worker_id = 2;
  uint64 epoch = 3;
}

message CreateOperation {
  string object_id = 1;
  string request_id = 2;
  string type = 3;
  string version = 4;
  JsonValue input = 5;
}

message InvokeOperation {
  string object_id = 1;
  string request_id = 2;
  string method = 3;
  JsonValue argument = 4;
}

// Для подтверждённого исхода сервер заполняет ровно одну ветку.
// Сохранённый предметный отказ можно вернуть при повторе запроса.
message OperationResult {
  oneof outcome {
    JsonValue result = 1;
    string domain_rejection = 2;
  }
}

// Сервер вкладывает ErrorDetail в google.rpc.Status.details при технической ошибке.
message ErrorDetail {
  ErrorCode code = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_OBJECT_ALREADY_EXISTS = 4;
  ERROR_CODE_CODE_VERSION_CONFLICT = 5;
  ERROR_CODE_REQUEST_ID_CONFLICT = 6;
  ERROR_CODE_LIMIT_EXCEEDED = 7;
  ERROR_CODE_OVERLOADED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_EXECUTION_TIMEOUT = 10;
  ERROR_CODE_INTERNAL_ERROR = 11;
  ERROR_CODE_STALE_OWNER = 12;
  ERROR_CODE_STALE_CONTROLLER = 13;
}
